<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Food Facts Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f4f1e9;
      --paper-light: #faf8f2;
      --paper-card: #fdfbf6;
      --ink: #1c1917;
      --ink-soft: #55504a;
      --ink-faint: #948d82;
      --rule: #e3ddce;
      --rule-soft: #ece7d9;
      --accent: #8b3a1f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      font-size: 15px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Banner ---------- */

    .banner {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .banner-inner {
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .banner-title {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--ink);
    }

    .banner-meta {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 0.875rem;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    /* ---------- Hero ---------- */

    .hero {
      padding: 4rem 2rem 3rem;
      text-align: center;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 3rem;
    }

    .hero-inner { max-width: 720px; margin: 0 auto; }

    .hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: 3.25rem;
      line-height: 1.05;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 1.25rem;
    }

    .hero .subtitle {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 1.0625rem;
      color: var(--ink-soft);
      max-width: 480px;
      margin: 0 auto;
    }

    /* ---------- Container ---------- */

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2rem 5rem;
    }

    /* ---------- Search ---------- */

    form {
      display: flex;
      max-width: 640px;
      margin: 0 auto 3rem;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--paper-card);
      transition: border-color 0.2s;
    }

    form:focus-within { border-color: var(--ink); }

    input[type="text"] {
      flex: 1;
      padding: 1rem 1.25rem;
      border: none;
      background: transparent;
      font-family: Georgia, serif;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }

    button#search-btn {
      padding: 0 1.75rem;
      background: var(--ink);
      color: var(--paper-light);
      border: none;
      border-radius: 0;
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#search-btn:hover:not(:disabled) { background: var(--accent); }
    button#search-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---------- Filter row ---------- */

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      max-width: 720px;
      margin: 0 auto 3rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    .filter-row.hidden { display: none; }

    .filter-row > span {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 0.9375rem;
      color: var(--ink-soft);
      margin-right: 1rem;
    }

    .grade-btn {
      width: 2.125rem;
      height: 2.125rem;
      border-radius: 50%;
      border: none;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 0.9375rem;
      text-transform: uppercase;
      cursor: pointer;
      color: white;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .grade-btn:hover { transform: scale(1.06); }

    .grade-btn.active {
      box-shadow: 0 0 0 1px var(--paper), 0 0 0 2px var(--ink);
    }

    .grade-a { background: #4d6b3d; }
    .grade-b { background: #7a8f4a; }
    .grade-c { background: #c2a15a; color: #2e2812; }
    .grade-d { background: #b06a3a; }
    .grade-e { background: #8b3a1f; }

    .grade-all {
      height: 2.125rem;
      padding: 0 1rem;
      border-radius: 9999px;
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      font-family: Georgia, serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .grade-all:hover { border-color: var(--ink-faint); }
    .grade-all.active {
      background: var(--ink);
      color: var(--paper-light);
      border-color: var(--ink);
    }

    /* ---------- Grid ---------- */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2.5rem 2rem;
    }

    /* ---------- Card ---------- */

    .card {
      background: var(--paper-card);
      border: 1px solid var(--rule);
      border-radius: 2px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--ink-faint);
      box-shadow: 0 24px 44px -28px rgba(28, 25, 23, 0.28);
    }

    .card-img {
      height: 250px;
      background: var(--paper-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-bottom: 1px solid var(--rule);
    }

    .card-img img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .card-img .no-img {
      font-family: Georgia, serif;
      font-style: italic;
      color: var(--ink-faint);
      font-size: 0.875rem;
    }

    .card-body { padding: 1.5rem 1.5rem 1.75rem; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.875rem;
    }

    .card-title {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 1.125rem;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      letter-spacing: -0.005em;
    }

    .card-brand {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .badge {
      width: 1.875rem;
      height: 1.875rem;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 0.9375rem;
      color: white;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .nova {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
      font-weight: 500;
    }

    .nutrients {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule-soft);
    }

    .nutrient { padding: 0.5rem 0; }

    .nutrient-value {
      font-family: Georgia, serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.15;
    }

    .nutrient-label {
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      margin-top: 0.375rem;
      font-weight: 500;
    }

    .allergens {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule-soft);
    }

    .allergen {
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 0.25rem 0.5rem;
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      border-radius: 2px;
      font-weight: 500;
    }

    /* ---------- States ---------- */

    .state {
      text-align: center;
      padding: 6rem 2rem;
      max-width: 520px;
      margin: 0 auto;
    }

    .state .emoji {
      font-size: 1.75rem;
      margin-bottom: 1.75rem;
      display: block;
      opacity: 0.45;
      filter: grayscale(1);
    }

    .state h2 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 1.75rem;
      color: var(--ink);
      margin-bottom: 0.875rem;
      letter-spacing: -0.01em;
    }

    .state p {
      font-size: 0.9375rem;
      line-height: 1.7;
      color: var(--ink-soft);
    }

    /* ---------- Skeleton ---------- */

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2.5rem 2rem;
    }

    .skeleton {
      background: linear-gradient(90deg, #ece7da 25%, #e3ddcc 50%, #ece7da 75%);
      background-size: 200% 100%;
      border-radius: 2px;
      height: 440px;
      animation: shimmer 1.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---------- Footer ---------- */

    footer {
      margin-top: 6rem;
      padding: 2.5rem 0 0;
      border-top: 1px solid var(--rule);
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 0.875rem;
      color: var(--ink-faint);
      text-align: center;
    }

    footer a {
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
      transition: border-color 0.15s, color 0.15s;
    }

    footer a:hover { color: var(--ink); border-color: var(--ink); }

    /* ---------- Responsive ---------- */

    @media (max-width: 640px) {
      .banner { padding: 0.875rem 1.25rem; }
      .banner-meta { font-size: 0.75rem; }
      .hero { padding: 3rem 1.5rem 2rem; }
      .hero h1 { font-size: 2.25rem; }
      .container { padding: 0 1.25rem 4rem; }
      form { flex-direction: column; }
      button#search-btn { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-inner">
      <span class="banner-title">Nutrition Archive</span>
      <span class="banner-meta">A reference collection, no. 1</span>
    </div>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <h1>Open Food Facts Explorer</h1>
      <p class="subtitle">Search over 2.8 million packaged products by name or barcode.</p>
    </div>
  </div>

  <div class="container">
    <form id="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="Search by product name or barcode…"
        autocomplete="off"
      />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div class="filter-row hidden" id="filter-row">
      <span>Filter by Nutri-Score</span>
      <button type="button" class="grade-all active" data-grade="">All</button>
      <button type="button" class="grade-btn grade-a" data-grade="a">A</button>
      <button type="button" class="grade-btn grade-b" data-grade="b">B</button>
      <button type="button" class="grade-btn grade-c" data-grade="c">C</button>
      <button type="button" class="grade-btn grade-d" data-grade="d">D</button>
      <button type="button" class="grade-btn grade-e" data-grade="e">E</button>
    </div>

    <div id="results">
      <p class="state" id="initial-state">
        Search for a product to get started. Try &quot;nutella&quot; or a barcode like 3017620422003.
      </p>
    </div>

    <footer>
      Data from <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> · ODbL licence
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
